[project]
name = "AVHM"
version = "1.0.0"
authors = [{ name = "keogh" }]
description = """\
Absolute Vault Hunter Mode: Play UVHM from level 1 with sensible scaling. \
Enemies, loot, and missions scale to player level. Health regen removed by default. \
Requires a Gibbed-edited save placed in UVHM at level 1. Solo only.
"""

[tool.sdkmod]
name = "AVHM (Absolute Vault Hunter Mode)"
supported_games = ["BL2"]
coop_support = "Incompatible"
